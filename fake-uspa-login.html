<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USPA Member Login (Mock)</title>
<style>
  :root {
    --navy: #0b1f3a;
    --orange: #ff6b1a;
    --paper: #f7f5f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--navy);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--paper);
    border-radius: 16px;
    padding: 32px 28px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }
  .badge {
    display: inline-block;
    background: var(--orange);
    color: white;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 16px;
    text-transform: uppercase;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
    color: var(--navy);
  }
  p.sub {
    margin: 0 0 24px;
    color: #666;
    font-size: 14px;
  }
  .app-name {
    font-weight: 600;
    color: var(--navy);
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--navy);
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #d8d4cb;
    border-radius: 10px;
    font-size: 15px;
    background: white;
  }
  input[type="text"]:focus, input[type="password"]:focus {
    outline: none;
    border-color: var(--orange);
  }
  input.invalid {
    border-color: #c0392b;
  }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--orange);
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  button:active { opacity: 0.85; }
  .fine-print {
    margin-top: 16px;
    font-size: 11px;
    color: #999;
    text-align: center;
    line-height: 1.5;
  }
  .hint {
    margin-top: 10px;
    font-size: 12px;
    color: #999;
    text-align: center;
  }
  .error {
    color: #c0392b;
    font-size: 13px;
    margin-top: 12px;
    display: none;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">Mock / Dev Only</span>
    <h1>USPA Member Login</h1>
    <p class="sub"><span class="app-name">Jump Box</span> wants to verify your USPA licenses and ratings.</p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input type="text" id="email" placeholder="email" autocomplete="off" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="password" required>

      <div class="error" id="errorMsg">Incorrect email or password.</div>

      <button type="submit">Login & Authorize Jump Box</button>
    </form>

    <p class="hint">Dev credentials: <strong>test</strong> / <strong>123</strong></p>
    <p class="fine-print">
      This is a fake screen for local development only.<br>
      It does not connect to the real USPA.
    </p>
  </div>

<script>
  // ---------------------------------------------------------------
  // Where to send the user back to after "login".
  // Your app passes this in, e.g.
  // fake-uspa-login.html?redirect_uri=jumpbox://uspa-callback
  // ---------------------------------------------------------------
  const params = new URLSearchParams(window.location.search);
  const redirectUri = params.get('redirect_uri') || 'jumpbox://uspa-callback';

  const VALID_EMAIL = 'test';
  const VALID_PASSWORD = '123';

  // ---------------------------------------------------------------
  // MEMBER IDENTITY
  // ---------------------------------------------------------------
  const MEMBER = {
    member_id: '123456',
    name: 'Jane Skydiver',
    // USPA license number — used to validate signatures on logbook
    // entries. Stored, but not shown on the profile screen.
    license_number: '100505'
  };

  // ---------------------------------------------------------------
  // LICENSES — permanent once earned, never expire.
  // Only a date_earned is needed.
  // ---------------------------------------------------------------
  const LICENSES = {
    a: '2019-05-14',
    b: '2019-08-02',
    c: '2020-03-21',
    d: '2021-07-09'
  };

  // ---------------------------------------------------------------
  // RATINGS — expire if not renewed. Lose the rating, lose the
  // privilege. Each needs an expiration so the app can tell the
  // difference between current and lapsed.
  // Set expires to a past date to test the "expired" state.
  // ---------------------------------------------------------------
  const RATINGS = {
    pro:             { earned: '2022-04-18', expires: '2027-04-30' },
    tandem:          { earned: '2021-09-30', expires: '2027-09-30' },
    aff:             { earned: '2022-01-15', expires: '2027-01-31' },
    iad:             { earned: '2021-11-06', expires: '2027-11-30' },
    coach:           { earned: '2020-06-12', expires: '2027-06-30' },
    tandem_examiner: { earned: '2024-02-20', expires: '2027-02-28' },
    aff_examiner:    { earned: '2024-05-08', expires: '2027-05-31' },
    iad_examiner:    { earned: '2023-10-17', expires: '2027-10-31' },
    coach_examiner:  { earned: '2023-03-25', expires: '2027-03-31' }
  };

  // Work out whether a rating is still current, based on today's date.
  function ratingStatus(expires) {
    const today = new Date();
    const expiryDate = new Date(expires + 'T23:59:59');
    return expiryDate >= today ? 'current' : 'expired';
  }

  // Highest license held (D beats C beats B beats A).
  function highestLicense(licenses) {
    const order = ['d', 'c', 'b', 'a'];
    for (let i = 0; i < order.length; i++) {
      if (licenses[order[i]]) return order[i].toUpperCase();
    }
    return null;
  }

  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();
    const errorMsg = document.getElementById('errorMsg');

    const isValid = (email === VALID_EMAIL && password === VALID_PASSWORD);

    if (!isValid) {
      errorMsg.style.display = 'block';
      emailInput.classList.add('invalid');
      passwordInput.classList.add('invalid');
      return;
    }

    errorMsg.style.display = 'none';
    emailInput.classList.remove('invalid');
    passwordInput.classList.remove('invalid');

    // Fake access token, as a real OAuth provider would issue.
    const fakeToken = 'mock_' + Math.random().toString(36).slice(2, 12);

    const callback = new URL(redirectUri);
    callback.searchParams.set('token', fakeToken);
    callback.searchParams.set('status', 'verified');

    // Identity fields
    Object.keys(MEMBER).forEach(function (key) {
      callback.searchParams.set(key, MEMBER[key]);
    });

    // Licenses: license_a_earned, license_b_earned, ...
    Object.keys(LICENSES).forEach(function (key) {
      callback.searchParams.set('license_' + key + '_earned', LICENSES[key]);
    });
    callback.searchParams.set('highest_license', highestLicense(LICENSES));

    // Ratings: rating_tandem_earned, rating_tandem_expires,
    //          rating_tandem_status, ...
    Object.keys(RATINGS).forEach(function (key) {
      const r = RATINGS[key];
      callback.searchParams.set('rating_' + key + '_earned', r.earned);
      callback.searchParams.set('rating_' + key + '_expires', r.expires);
      callback.searchParams.set('rating_' + key + '_status', ratingStatus(r.expires));
    });

    // This is the redirect your app catches.
    window.location.href = callback.toString();
  });
</script>
</body>
</html>
