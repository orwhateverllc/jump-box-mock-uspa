<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USPA Member Login (Mock)</title>
<style>
  :root {
    --navy: #0b1f3a;
    --orange: #ff6b1a;
    --paper: #f7f5f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--navy);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--paper);
    border-radius: 16px;
    padding: 32px 28px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }
  .badge {
    display: inline-block;
    background: var(--orange);
    color: white;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 16px;
    text-transform: uppercase;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
    color: var(--navy);
  }
  p.sub {
    margin: 0 0 24px;
    color: #666;
    font-size: 14px;
  }
  .app-name {
    font-weight: 600;
    color: var(--navy);
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--navy);
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #d8d4cb;
    border-radius: 10px;
    font-size: 15px;
    background: white;
  }
  input:focus {
    outline: none;
    border-color: var(--orange);
  }
  input.invalid {
    border-color: #c0392b;
  }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--orange);
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  button:active { opacity: 0.85; }
  .fine-print {
    margin-top: 16px;
    font-size: 11px;
    color: #999;
    text-align: center;
    line-height: 1.5;
  }
  .hint {
    margin-top: 10px;
    font-size: 12px;
    color: #999;
    text-align: center;
  }
  .error {
    color: #c0392b;
    font-size: 13px;
    margin-top: 12px;
    display: none;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">Mock / Dev Only</span>
    <h1>USPA Member Login</h1>
    <p class="sub"><span class="app-name">Jump Box</span> wants to verify your USPA membership.</p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input type="text" id="email" placeholder="email" autocomplete="off" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="password" required>

      <div class="error" id="errorMsg">Incorrect email or password.</div>

      <button type="submit">Login & Authorize Jump Box</button>
    </form>

    <p class="hint">Dev credentials: <strong>test</strong> / <strong>123</strong></p>
    <p class="fine-print">
      This is a fake screen for local development only.<br>
      It does not connect to the real USPA.
    </p>
  </div>

<script>
  // Read the redirect_uri your app passed in, e.g.
  // fake-uspa-login.html?redirect_uri=jumpbox://uspa-callback
  const params = new URLSearchParams(window.location.search);
  const redirectUri = params.get('redirect_uri') || 'jumpbox://uspa-callback';

  const VALID_EMAIL = 'test';
  const VALID_PASSWORD = '123';

  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();
    const errorMsg = document.getElementById('errorMsg');

    const isValid = (email === VALID_EMAIL && password === VALID_PASSWORD);

    if (!isValid) {
      errorMsg.style.display = 'block';
      emailInput.classList.add('invalid');
      passwordInput.classList.add('invalid');
      return;
    }

    errorMsg.style.display = 'none';
    emailInput.classList.remove('invalid');
    passwordInput.classList.remove('invalid');

    // Build a fake but realistic "verified member" payload.
    const fakeToken = 'mock_' + Math.random().toString(36).slice(2, 12);
    const fakeMemberId = '123456';
    const fakeName = 'Jane Skydiver';
    const fakeLicense = 'C';
    const fakeExpiration = '2027-06-30';

    const callback = new URL(redirectUri);
    callback.searchParams.set('member_id', fakeMemberId);
    callback.searchParams.set('name', fakeName);
    callback.searchParams.set('license_type', fakeLicense);
    callback.searchParams.set('expiration', fakeExpiration);
    callback.searchParams.set('token', fakeToken);
    callback.searchParams.set('status', 'verified');

    // This is the redirect that expo-web-browser catches.
    window.location.href = callback.toString();
  });
</script>
</body>
</html>
